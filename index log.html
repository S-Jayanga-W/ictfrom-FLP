<!DOCTYPE html>
<html lang="si">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ictfrom | Free Learn Pack (FLP) | Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
  :root{
    --black:#0a0a0a;
    --black-2:#141414;
    --red:#e5121a;
    --red-dim:#7a0c11;
    --white:#f5f5f5;
    --grey:#8a8a8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Consolas','Courier New',monospace;
    background:var(--black);
    color:var(--white);
    position:relative;
    min-height:100vh;
  }

  .bg-layer{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(229,18,26,0.10), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(229,18,26,0.08), transparent 50%),
      var(--black);
  }

  #netCanvas{
    position:fixed; inset:0; z-index:0; display:block;
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    z-index:0;
    opacity:.55;
    animation:drift ease-in-out infinite alternate;
  }
  .orb.red{ background:radial-gradient(circle, rgba(229,18,26,0.55), transparent 70%); }
  .orb.white{ background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .orb1{ width:420px; height:420px; top:-10%; left:-8%; animation-duration:18s; }
  .orb2{ width:360px; height:360px; bottom:-12%; right:-6%; animation-duration:22s; animation-delay:2s; }
  .orb3{ width:260px; height:260px; top:40%; left:65%; animation-duration:16s; animation-delay:4s; }
  @keyframes drift{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,-30px) scale(1.12); }
    100%{ transform:translate(-30px,25px) scale(0.95); }
  }

  .sweep-beam{
    position:fixed; top:0; bottom:0; width:180px;
    background:linear-gradient(90deg, transparent, rgba(229,18,26,0.09), transparent);
    filter:blur(6px);
    animation:beamMove 9s ease-in-out infinite;
    z-index:0;
  }
  @keyframes beamMove{
    0%{ left:-15%; }
    50%{ left:85%; }
    100%{ left:-15%; }
  }

  .scanline{
    position:fixed; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow:0 0 20px 4px rgba(229,18,26,0.6);
    animation:scan 6s ease-in-out infinite;
    z-index:1; opacity:.6;
  }
  @keyframes scan{
    0%{top:0%;}
    50%{top:100%;}
    100%{top:0%;}
  }

  .wrap{
    position:relative; z-index:2;
    width:100%; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 16px;
  }

  .card{
    width:420px;
    max-width:92vw;
    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(229,18,26,0.35);
    border-radius:14px;
    padding:42px 36px 34px;
    box-shadow:0 0 40px rgba(229,18,26,0.15), 0 20px 60px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
    animation:cardIn .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(30px) scale(.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .card::before{
    content:"";
    position:absolute; top:-2px; left:-2px; right:-2px; height:3px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    animation:sweep 3s linear infinite;
  }
  @keyframes sweep{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }

  .brand{
    text-align:center;
    margin-bottom:6px;
  }
  .brand .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:3px;
    color:var(--red);
    border:1px solid var(--red-dim);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:14px;
    animation:pulseTag 2.4s ease-in-out infinite;
  }
  @keyframes pulseTag{
    0%,100%{box-shadow:0 0 0 rgba(229,18,26,0);}
    50%{box-shadow:0 0 12px rgba(229,18,26,0.5);}
  }
  h1{
    font-family:'Segoe UI', sans-serif;
    font-size:28px;
    font-weight:800;
    letter-spacing:1px;
    text-align:center;
    color:var(--white);
    text-transform:uppercase;
  }
  h1 span{color:var(--red);}
  .sub{
    text-align:center;
    color:var(--grey);
    font-size:12.5px;
    margin-top:6px;
    margin-bottom:26px;
    letter-spacing:.5px;
  }

  .field{
    position:relative;
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:11px;
    color:var(--grey);
    letter-spacing:.5px;
    margin-bottom:6px;
    padding-left:2px;
    text-transform:uppercase;
  }
  .field input, .field select{
    width:100%;
    padding:13px 44px 13px 16px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    color:var(--white);
    font-size:14px;
    outline:none;
    transition:border-color .25s, box-shadow .25s, background .25s;
    font-family:inherit;
  }
  .field select{ appearance:none; cursor:pointer; }
  .field input::placeholder{color:#666;}
  .field input:focus, .field select:focus{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(229,18,26,0.15);
    background:rgba(229,18,26,0.04);
  }
  .field .icon{
    position:absolute;
    right:14px; top:calc(50% + 10px);
    transform:translateY(-50%);
    color:var(--grey);
    width:18px; height:18px;
    transition:color .25s;
    pointer-events:none;
  }
  .field:has(label) .icon{ top:calc(50% + 11px); }
  .field input:focus ~ .icon, .field select:focus ~ .icon{color:var(--red);}

  .field .err{
    font-size:11px;
    color:var(--red);
    margin-top:6px;
    padding-left:2px;
    display:none;
    animation:shakeErr .35s;
  }
  .field.invalid input, .field.invalid select{
    border-color:var(--red);
    animation:shakeErr .35s;
  }
  .field.invalid .err{display:block;}
  @keyframes shakeErr{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .section-label{
    font-size:11px;
    color:var(--red);
    letter-spacing:2px;
    text-transform:uppercase;
    margin:4px 0 14px;
    font-weight:700;
  }

  /* Google button */
  .g-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:13px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    background:var(--white);
    color:#1f1f1f;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
    transition:transform .15s, box-shadow .25s, background .2s;
    font-family:'Segoe UI', sans-serif;
  }
  .g-btn:hover{
    background:#f3f3f3;
    box-shadow:0 0 20px rgba(255,255,255,0.15);
  }
  .g-btn:active{ transform:scale(.98); }
  .g-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .g-btn svg{ width:20px; height:20px; flex-shrink:0; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
    color:var(--grey);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,0.12);
  }

  .switch{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--grey);
  }
  .switch b{
    color:var(--red);
    cursor:pointer;
    font-weight:700;
  }
  .switch b:hover{text-decoration:underline;}

  .toast{
    position:fixed;
    bottom:26px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--black-2);
    border:1px solid var(--red);
    color:var(--white);
    padding:12px 22px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:10;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    max-width:88vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast.success{border-color:#2ecc71; color:#2ecc71;}

  .forms{position:relative;}
  .form-panel{
    animation:fadeSlide .4s ease;
  }
  @keyframes fadeSlide{
    from{opacity:0; transform:translateX(14px);}
    to{opacity:1; transform:translateX(0);}
  }
  .hidden{display:none;}

  @media (max-width:420px){
    .card{padding:32px 22px 26px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="netCanvas"></canvas>
<div class="orb red orb1"></div>
<div class="orb white orb2"></div>
<div class="orb red orb3"></div>
<div class="sweep-beam"></div>
<div class="scanline"></div>

<div class="wrap">
  <div class="card">
    <div class="brand">
      <span class="tag">SECURE ACCESS</span>
      <h1 id="formTitle">LOG<span>IN</span></h1>
      <div class="sub" id="formSub">ictfrom | Free Learn Pack (FLP) &mdash; Continue with your Gmail account</div>
    </div>

    <div class="forms">

      <!-- LOGIN PANEL -->
      <div id="loginPanel" class="form-panel">
        <button type="button" class="g-btn" id="googleLoginBtn">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 16.2 4 9.5 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.4 0-9.9-3.3-11.4-8l-6.6 5.1C9.4 39.5 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.8-5.1 6.3l6.6 5.6C39.9 37.6 44 31.6 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="switch">Don't have an account? <b id="toRegister">Register</b></div>
      </div>

      <!-- REGISTER PANEL (Student Details) -->
      <div id="registerPanel" class="form-panel hidden">
        <div class="section-label">Student Details</div>

        <div class="field">
          <label>Full Name</label>
          <input type="text" placeholder="e.g. Kasun Perera" id="regName" required>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="tel" placeholder="e.g. 0771234567" id="regPhone" required>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.7 5.1 6.5 6.5l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
        </div>

        <div class="field">
          <label>Address</label>
          <input type="text" placeholder="e.g. 45/2, Galle Road, Colombo" id="regAddress" required>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
        </div>

        <div class="field">
          <label>School</label>
          <input type="text" placeholder="e.g. Ananda College" id="regSchool" required>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2V17c0 2.2 3.1 4 7 4s7-1.8 7-4v-3.8l-7 3.8-7-3.8z"/></svg>
        </div>

        <div class="field">
          <label>A/L Batch</label>
          <input type="text" placeholder="e.g. 2025 A/L" id="regBatch" required>
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 7l11 5 9-4.1V17h2V7L12 2zM5 12.4V16c0 2.2 3.1 4 7 4s7-1.8 7-4v-3.6l-7 3.2-7-3.2z"/></svg>
        </div>

        <div class="divider">then verify with</div>
        <button type="button" class="g-btn" id="googleRegisterBtn">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 16.2 4 9.5 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.4 0-9.9-3.3-11.4-8l-6.6 5.1C9.4 39.5 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.8-5.1 6.3l6.6 5.6C39.9 37.6 44 31.6 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="switch">Already have an account? <b id="toLogin">Login</b></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  // =========================================================
  // FIREBASE SETUP
  // =========================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    set,
    get
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCagFTgiAReVNf8PxNppg01URkQRPoNw3A",
    authDomain: "ictfrom-free-learn-pack.firebaseapp.com",
    databaseURL: "https://ictfrom-free-learn-pack-default-rtdb.firebaseio.com",
    projectId: "ictfrom-free-learn-pack",
    storageBucket: "ictfrom-free-learn-pack.firebasestorage.app",
    messagingSenderId: "621015284854",
    appId: "1:621015284854:web:850148451720ff2529b357",
    measurementId: "G-7MPX23W72F"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // ---- network background (canvas: red/white nodes on black) ----
  (function(){
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, nodes;
    const NODE_COUNT = 70;
    const LINK_DIST = 140;
    const mouse = { x:null, y:null };

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makeNodes(){
      nodes = [];
      for(let i=0;i<NODE_COUNT;i++){
        const isRed = Math.random() < 0.4;
        nodes.push({
          x: Math.random()*w,
          y: Math.random()*h,
          vx: (Math.random()-0.5)*0.35,
          vy: (Math.random()-0.5)*0.35,
          r: isRed ? Math.random()*2+1.4 : Math.random()*1.6+0.8,
          color: isRed ? '229,18,26' : '245,245,245'
        });
      }
    }
    makeNodes();

    window.addEventListener('mousemove', e=>{
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', ()=>{ mouse.x=null; mouse.y=null; });

    function step(){
      ctx.clearRect(0,0,w,h);
      for(const n of nodes){
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > w) n.vx *= -1;
        if(n.y < 0 || n.y > h) n.vy *= -1;

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${n.color},0.85)`;
        ctx.shadowColor = `rgba(${n.color},0.8)`;
        ctx.shadowBlur = 6;
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for(let i=0;i<nodes.length;i++){
        for(let j=i+1;j<nodes.length;j++){
          const a = nodes[i], b = nodes[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < LINK_DIST){
            const alpha = (1 - dist/LINK_DIST) * 0.35;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(229,18,26,${alpha})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
        if(mouse.x !== null){
          const dx = nodes[i].x-mouse.x, dy = nodes[i].y-mouse.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 160){
            const alpha = (1 - dist/160) * 0.6;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(245,245,245,${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(step);
    }
    step();
  })();

  // ---- panel switching ----
  const loginPanel = document.getElementById('loginPanel');
  const registerPanel = document.getElementById('registerPanel');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');

  document.getElementById('toRegister').onclick = () => {
    loginPanel.classList.add('hidden');
    registerPanel.classList.remove('hidden');
    registerPanel.style.animation='none'; void registerPanel.offsetWidth; registerPanel.style.animation='fadeSlide .4s ease';
    formTitle.innerHTML = 'REG<span>ISTER</span>';
    formSub.textContent = 'ictfrom | Free Learn Pack (FLP) | Fill your student details to register';
  };
  document.getElementById('toLogin').onclick = () => {
    registerPanel.classList.add('hidden');
    loginPanel.classList.remove('hidden');
    loginPanel.style.animation='none'; void loginPanel.offsetWidth; loginPanel.style.animation='fadeSlide .4s ease';
    formTitle.innerHTML = 'LOG<span>IN</span>';
    formSub.textContent = 'ICT Site — Continue with your Gmail account';
  };

  // ---- toast ----
  const toast = document.getElementById('toast');
  function showToast(msg, ok){
    toast.textContent = msg;
    toast.className = 'toast show' + (ok ? ' success':'');
    setTimeout(()=>{ toast.className='toast'; }, 3200);
  }

  // =========================================================
  // GOOGLE SIGN-IN (Firebase — real database, works from any device)
  // =========================================================
  const REDIRECT_PAGE = 'dashboard.html'; // <-- change this to your page name

  // ---- LOGIN with Google ----
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  googleLoginBtn.addEventListener('click', async ()=>{
    googleLoginBtn.disabled = true;
    try{
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      // must already exist in our database to be allowed to "login"
      const snap = await get(ref(db, 'users/' + user.uid));
      if(!snap.exists()){
        await signOut(auth);
        showToast('No account found for this Gmail. Please register first.', false);
        return;
      }

      showToast('Login successful. Welcome back, ' + (user.displayName || 'friend') + '!', true);
      setTimeout(()=>{ window.location.href = REDIRECT_PAGE; }, 1000);
    }catch(err){
      showToast(err.message.replace('Firebase: ',''), false);
    }finally{
      googleLoginBtn.disabled = false;
    }
  });

  // ---- REGISTER with Google (student details first) ----
  const googleRegisterBtn = document.getElementById('googleRegisterBtn');
  const regFields = {
    name: document.getElementById('regName'),
    phone: document.getElementById('regPhone'),
    address: document.getElementById('regAddress'),
    school: document.getElementById('regSchool'),
    batch: document.getElementById('regBatch'),
  };

  function validateStudentDetails(){
    let ok = true;
    for(const key in regFields){
      const el = regFields[key];
      const field = el.closest('.field');
      if(!el.value.trim()){
        field.classList.add('invalid');
        ok = false;
      } else {
        field.classList.remove('invalid');
      }
    }
    return ok;
  }

  Object.values(regFields).forEach(el=>{
    el.addEventListener('input', ()=> el.closest('.field').classList.remove('invalid'));
  });

  googleRegisterBtn.addEventListener('click', async ()=>{
    if(!validateStudentDetails()){
      showToast('Please fill in all student details', false);
      return;
    }

    googleRegisterBtn.disabled = true;
    try{
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      const snap = await get(ref(db, 'users/' + user.uid));
      if(snap.exists()){
        showToast('This Gmail is already registered. Please login instead.', false);
        setTimeout(()=>{ document.getElementById('toLogin').click(); }, 1200);
        return;
      }

      await set(ref(db, 'users/' + user.uid), {
        name: regFields.name.value.trim(),
        phone: regFields.phone.value.trim(),
        email: user.email,
        address: regFields.address.value.trim(),
        school: regFields.school.value.trim(),
        alBatch: regFields.batch.value.trim(),
        photoURL: user.photoURL || ''
      });

      showToast('Account created for ' + regFields.name.value.trim() + '! Redirecting...', true);
      setTimeout(()=>{ window.location.href = REDIRECT_PAGE; }, 1200);
    }catch(err){
      showToast(err.message.replace('Firebase: ',''), false);
    }finally{
      googleRegisterBtn.disabled = false;
    }
  });
</script>

</body>
</html>
