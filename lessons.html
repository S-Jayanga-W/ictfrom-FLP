<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Lessons | ictfrom FLP</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0a0a; --panel:#141414; --panel-2:#1b1b1b; --line:rgba(255,255,255,.09); --text:#f5f5f5; --muted:#8f8f8f; --red:#e5121a; --red-dim:rgba(229,18,26,.14); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;}
  #userInfo{color:var(--muted);font-size:13px;}
  #logoutBtn{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:6px;font-size:12.5px;cursor:pointer;}
  #logoutBtn:hover{border-color:var(--red);color:var(--red);}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;flex-wrap:wrap;gap:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;overflow:hidden;}
  .card.locked{opacity:.85;}
  .lesson-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;margin-bottom:6px;}
  .lesson-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .status{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;margin-bottom:16px;}
  .status.unlocked{background:rgba(61,220,132,.12);color:#3ddc84;}
  .status.locked{background:var(--red-dim);color:var(--red);}
  .action{display:block;text-align:center;padding:11px;border-radius:8px;font-weight:600;font-size:13.5px;text-decoration:none;}
  .action.go{background:var(--red);color:#fff;}
  .action.go:hover{background:#ff2e28;}
  .pay-note{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);line-height:1.6;}
  .pay-note b{color:var(--text);}
  #loading{color:var(--muted);font-size:14px;padding:40px 0;text-align:center;}
  a{color:inherit;}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>My Lessons</h1>
      <div id="userInfo">Loading...</div>
    </div>
    <button id="logoutBtn">Log out</button>
  </div>

  <div id="loading">Loading your lessons...</div>
  <div class="grid" id="lessonGrid" style="display:none;"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    getDatabase, ref, onValue
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

  // Same Firebase project + same Realtime Database already used by index log.html
  const firebaseConfig = {
    apiKey: "AIzaSyCagFTgiAReVNf8PxNppg01URkQRPoNw3A",
    authDomain: "ictfrom-free-learn-pack.firebaseapp.com",
    databaseURL: "https://ictfrom-free-learn-pack-default-rtdb.firebaseio.com",
    projectId: "ictfrom-free-learn-pack",
    storageBucket: "ictfrom-free-learn-pack.firebasestorage.app",
    messagingSenderId: "621015284854",
    appId: "1:621015284854:web:850148451720ff2529b357",
    measurementId: "G-7MPX23W72F"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // ===========================================================
  // THE LESSON CATALOG — edit this list to match your real lessons.
  // "id" must be unique and is what admin.html uses to unlock a lesson.
  // "url" points at the REAL lesson folder already on your site.
  // "free: true" lessons skip the lock check entirely.
  // ===========================================================
  const LESSONS = [
    {
      id: "lesson01",
      title: "Lesson 01 — Basic Concepts Of ICT",
      sub: "11 Videos",
      url: "All Lessons/Lesson 01 (2028)/index.html",
      free: true
    },
    {
      id: "lesson02",
      title: "Lesson 02 — Evolution Of Computing",
      sub: "05 Videos",
      url: "All Lessons/Lesson 02 (2028)/index.html",
      free: false
    }
    // add more lessons here as you create them
  ];

  const LOGIN_PAGE = 'index log.html';

  const logoutBtn = document.getElementById('logoutBtn');
  logoutBtn.addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = LOGIN_PAGE;
  });

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = LOGIN_PAGE;
      return;
    }
    document.getElementById('userInfo').textContent = user.displayName || user.email || '';

    // Lock state lives at a SEPARATE path from your student profile data
    // ( users/{uid} is untouched — this reads unlocked/{uid} instead ).
    // Live-listens, so admin unlocking updates this page instantly.
    const unlockedRef = ref(db, 'unlocked/' + user.uid);
    onValue(unlockedRef, (snap) => {
      const data = snap.exists() ? snap.val() : {};
      renderLessons(data); // data = { lesson02: true, ... }
    }, (err) => {
      console.error('Failed to read unlock data:', err);
      document.getElementById('loading').textContent =
        'Could not load your lessons. Please refresh or contact admin.';
    });
  });

  function renderLessons(unlockedMap) {
    const grid = document.getElementById('lessonGrid');
    document.getElementById('loading').style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = '';

    LESSONS.forEach(lesson => {
      const isUnlocked = lesson.free || !!unlockedMap[lesson.id];

      const card = document.createElement('div');
      card.id = 'lesson-' + lesson.id;
      card.className = 'card' + (isUnlocked ? '' : ' locked');

      card.innerHTML = `
        <div class="status ${isUnlocked ? 'unlocked' : 'locked'}">
          ${isUnlocked ? '✓ UNLOCKED' : '🔒 LOCKED'}
        </div>
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-sub">${lesson.sub}</div>
        ${
          isUnlocked
          ? `<a class="action go" href="${lesson.url}">Watch Lesson →</a>`
          : `<div class="pay-note">
               <b>Payment required.</b><br>
               Pay for this lesson and contact admin to unlock it.<br>
               WhatsApp: <b>071 455 5513</b>
             </div>`
        }
      `;
      grid.appendChild(card);
    });

    // Handle links like "lessons.html#lesson02" coming from Home.html's
    // video cards. If that specific lesson is unlocked, skip straight to
    // the video — no extra click needed. If it's locked, just scroll to
    // that card so the student sees why they can't watch it yet.
    const hashId = window.location.hash.replace('#', '');
    if (hashId) {
      const targetLesson = LESSONS.find(l => l.id === hashId);
      if (targetLesson) {
        const targetUnlocked = targetLesson.free || !!unlockedMap[targetLesson.id];
        if (targetUnlocked) {
          window.location.href = targetLesson.url;
          return;
        }
        const el = document.getElementById('lesson-' + hashId);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.style.outline = '2px solid var(--red)';
          setTimeout(() => { el.style.outline = 'none'; }, 2000);
        }
      }
    }
  }
</script>

</body>
</html>
