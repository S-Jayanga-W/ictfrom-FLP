<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch | ictfrom | Free Learn Pack (FLP)</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --black:#0a0a0a;
    --panel:#141110;
    --panel2:#1b1615;
    --line:#2a2422;
    --red:#e5121a;
    --red-dim:#7a0c11;
    --white:#f5f5f5;
    --grey:#8a8a8a;
    --green:#2ecc71;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Consolas','Courier New',monospace;
    background:var(--black);
    color:var(--white);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  a{ color:inherit; }

  /* ===== Animated background ===== */
  #bgCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    display:block;
  }
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(229,18,26,.12), transparent 60%),
      radial-gradient(700px 500px at 85% 30%, rgba(229,18,26,.08), transparent 60%),
      radial-gradient(800px 600px at 50% 100%, rgba(229,18,26,.10), transparent 60%);
    animation:bgShift 16s ease-in-out infinite alternate;
  }
  @keyframes bgShift{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(8deg) brightness(1.08); }
  }

  header.topbar, main{ position:relative; z-index:1; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(10,10,10,.92); backdrop-filter:blur(6px); z-index:10;
  }
  header.topbar .brand{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:1px; }
  header.topbar .brand img{ width:30px; height:30px; border-radius:6px; }
  header.topbar .brand span{ color:var(--red); }
  header.topbar a.back{
    display:flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--grey); font-size:13px;
    border:1px solid var(--line); padding:8px 14px; border-radius:6px; transition:.2s;
  }
  header.topbar a.back:hover{ border-color:var(--red); color:var(--white); }

  #status{
    text-align:center; color:var(--grey); margin-top:120px; font-size:14px; line-height:1.8;
  }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--red);
    margin:0 auto 16px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .lock-box{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:44px 26px; text-align:center; max-width:440px; margin:100px auto 0;
    animation:fadeUp .4s ease;
  }
  .lock-box .icon{ font-size:38px; margin-bottom:12px; }
  .lock-box .title{ font-size:15px; font-weight:700; }
  .lock-box p{ color:var(--grey); font-size:13px; margin-top:10px; line-height:1.7; }
  .lock-box a.btn{
    display:inline-block; margin-top:20px; text-decoration:none;
    background:var(--red); color:#fff; padding:11px 22px; border-radius:8px;
    font-size:13px; font-weight:700; transition:.2s;
  }
  .lock-box a.btn:hover{ background:#c40e15; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  main{
    max-width:1040px; margin:0 auto; padding:26px 20px 60px;
  }

  .player-wrap{ display:none; animation:fadeUp .4s ease; }
  .player-wrap.ready{ display:block; }

  /* ===== Custom player shell ===== */
  .video-frame{
    position:relative; width:100%; padding-top:56.25%;
    background:#000; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);
  }
  .video-frame iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    z-index:0;
    pointer-events:none; /* iframe never receives direct clicks - fully controlled via JS API */
  }

  /* Full-cover invisible layer. This is what actually receives every click/tap
     over the video area. Because the iframe itself has pointer-events:none,
     there is no way for a viewer to reach YouTube's own share icon, logo
     watermark, title bar, or "suggested videos" pause screen - none of that
     chrome is ever clickable, since input never reaches the iframe. */
  .yt-shield{
    position:absolute; inset:0; z-index:1;
    background:transparent; cursor:pointer;
  }

  /* Our own control bar, drawn on top of everything */
  .custom-controls{
    position:absolute; left:10px; right:10px; bottom:10px; z-index:2;
    display:flex; align-items:center; gap:12px;
    padding:8px 14px;
    border-radius:12px;
    background:rgba(12,10,10,.62);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 8px 24px -10px rgba(0,0,0,.6);
    opacity:1; transform:translateY(0);
    transition:opacity .28s ease, transform .28s ease;
  }
  /* extra gradient behind the bar so it stays legible over bright video frames */
  .video-frame::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:90px; z-index:1;
    background:linear-gradient(0deg, rgba(0,0,0,.55) 0%, transparent 100%);
    pointer-events:none;
    opacity:1; transition:opacity .28s ease;
  }
  .custom-controls.hidden,
  .video-frame.controls-hidden::after{
    opacity:0;
  }
  .custom-controls.hidden{
    transform:translateY(8px);
    pointer-events:none;
  }

  .cc-btn{
    background:none; border:none; color:var(--white); font-size:17px;
    cursor:pointer; padding:4px; line-height:1; flex:none;
    display:flex; align-items:center; justify-content:center;
    transition:color .15s, transform .15s;
  }
  .cc-btn:hover{ color:var(--red); transform:scale(1.1); }

  .cc-time{
    color:#cfcfcf; font-size:11px; white-space:nowrap; flex:none; min-width:84px;
    font-variant-numeric:tabular-nums;
  }

  .cc-progress{
    position:relative; flex:1; height:16px; display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .cc-progress::before{
    content:''; position:absolute; left:0; right:0; height:4px; border-radius:3px;
    background:rgba(255,255,255,.2);
    transition:height .15s ease;
  }
  .cc-progress-fill{
    position:absolute; left:0; height:4px; border-radius:3px; width:0%;
    background:var(--red); pointer-events:none;
    transition:height .15s ease;
  }
  .cc-progress-handle{
    position:absolute; left:0%; width:12px; height:12px; border-radius:50%;
    background:var(--red); transform:translateX(-50%) scale(0);
    pointer-events:none; transition:transform .15s ease;
    box-shadow:0 0 0 4px rgba(229,18,26,.22);
  }
  .cc-progress:hover::before{ height:6px; }
  .cc-progress:hover .cc-progress-fill{ height:6px; }
  .cc-progress:hover .cc-progress-handle,
  .cc-progress.seeking .cc-progress-handle{ transform:translateX(-50%) scale(1); }

  /* Volume: just an icon by default, slider slides out smoothly on hover/focus */
  .cc-volume-wrap{
    display:flex; align-items:center; flex:none;
    max-width:26px; overflow:hidden;
    transition:max-width .25s ease;
  }
  .cc-volume-wrap:hover,
  .cc-volume-wrap:focus-within{
    max-width:110px;
  }
  .cc-volume{
    width:70px; margin-left:8px; accent-color:var(--red);
    flex:none; opacity:0; transition:opacity .2s ease .05s;
  }
  .cc-volume-wrap:hover .cc-volume,
  .cc-volume-wrap:focus-within .cc-volume{
    opacity:1;
  }

  @media (max-width:520px){
    .custom-controls{ left:6px; right:6px; bottom:6px; padding:6px 10px; gap:8px; }
    .cc-volume-wrap{ display:none; }
    .cc-time{ min-width:64px; font-size:10px; }
  }

  .video-frame:fullscreen{ padding-top:0; height:100vh; border-radius:0; }
  .video-frame:-webkit-full-screen{ padding-top:0; height:100vh; border-radius:0; }
  .video-frame:fullscreen iframe,
  .video-frame:-webkit-full-screen iframe{ height:100%; }

  .meta{
    margin-top:22px; padding-bottom:20px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .meta .left{ flex:1; min-width:240px; }
  .meta .ep-tag{
    display:inline-block; color:var(--red); font-size:11px; font-weight:700;
    letter-spacing:1.5px; border:1px solid var(--red-dim); padding:4px 10px;
    border-radius:20px; margin-bottom:10px; background:rgba(229,18,26,.08);
  }
  .meta h1{ font-size:20px; line-height:1.4; margin-bottom:6px; }
  .meta .sub{ color:var(--grey); font-size:12px; }

  .badge-live{
    display:flex; align-items:center; gap:6px; color:var(--green); font-size:12px;
    border:1px solid #1c5c38; padding:6px 12px; border-radius:20px; background:rgba(46,204,113,.08);
    white-space:nowrap;
  }
  .badge-live .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .note-box{
    margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:12px; color:var(--grey); line-height:1.7;
  }

  /* ===== My Notes section ===== */
  .my-notes{
    margin-top:20px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px 18px 16px; animation:fadeUp .4s ease;
  }
  .my-notes .notes-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .my-notes .notes-head h2{
    font-size:13px; letter-spacing:1px; color:var(--white);
    display:flex; align-items:center; gap:8px;
  }
  .my-notes .notes-head h2::before{ content:"📝"; font-size:14px; }
  .my-notes textarea{
    width:100%; min-height:110px; resize:vertical;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--white); font-family:inherit; font-size:13px; line-height:1.6;
    padding:12px; outline:none; transition:border-color .2s;
  }
  .my-notes textarea:focus{ border-color:var(--red-dim); }
  .my-notes .notes-foot{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:10px; flex-wrap:wrap;
  }
  .my-notes .save-btn{
    background:var(--red); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; transition:.2s;
  }
  .my-notes .save-btn:hover{ background:#c40e15; }
  .my-notes .save-status{
    font-size:11px; color:var(--grey); transition:opacity .3s; opacity:0;
  }
  .my-notes .save-status.show{ opacity:1; }
  .my-notes .save-status.ok{ color:var(--green); }
</style>

<script>
  /* ===== Lightweight animated particle background ===== */
  (function(){
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles;
    const COUNT = 55;
    const COLOR = '229,18,26'; // matches --red

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeParticles(){
      particles = Array.from({length: COUNT}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.8 + 0.6,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.5 + 0.15
      }));
    }

    function step(){
      ctx.clearRect(0, 0, w, h);

      for (const p of particles){
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${COLOR},${p.a})`;
        ctx.fill();
      }

      for (let i = 0; i < particles.length; i++){
        for (let j = i + 1; j < particles.length; j++){
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 120){
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(${COLOR},${0.08 * (1 - dist/120)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(step);
    }

    window.addEventListener('resize', () => { resize(); makeParticles(); });
    resize();
    makeParticles();
    requestAnimationFrame(step);
  })();
</script>

<!-- YouTube IFrame Player API - lets us drive the video (play/pause/seek/volume)
     purely via JavaScript, so the viewer never has to click on the iframe
     itself (see .yt-shield above: iframe has pointer-events:none). -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  let ytApiReady = false;
  let pendingVideoInit = false;

  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    if (pendingVideoInit) createPlayer();
  };

  window.ytPlayer = null;
  window.pendingVideoId = null;
  let timeLoop = null;
  let userSeeking = false;

  function createPlayer(){
    if (!window.pendingVideoId) return;
    window.ytPlayer = new YT.Player('ytFrame', {
      width: '100%',
      height: '100%',
      videoId: window.pendingVideoId,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        autoplay: 1,
        rel: 0,
        modestbranding: 1,
        iv_load_policy: 3,
        controls: 0,
        disablekb: 1,
        fs: 0,
        playsinline: 1,
        origin: window.location.origin
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  }

  function formatTime(s){
    s = Math.max(0, Math.floor(s || 0));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function setFill(frac){
    frac = Math.min(1, Math.max(0, frac));
    document.getElementById('ccProgressFill').style.width = (frac * 100) + '%';
    document.getElementById('ccProgressHandle').style.left = (frac * 100) + '%';
  }

  function startTimeLoop(){
    clearInterval(timeLoop);
    timeLoop = setInterval(() => {
      if (!window.ytPlayer || userSeeking) return;
      const cur = window.ytPlayer.getCurrentTime ? window.ytPlayer.getCurrentTime() : 0;
      const dur = window.ytPlayer.getDuration ? window.ytPlayer.getDuration() : 0;
      if (dur > 0) setFill(cur / dur);
      document.getElementById('ccTime').textContent = formatTime(cur) + ' / ' + formatTime(dur);
    }, 400);
  }

  function togglePlay(){
    if (!window.ytPlayer || !window.ytPlayer.getPlayerState) return;
    const state = window.ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) window.ytPlayer.pauseVideo();
    else window.ytPlayer.playVideo();
  }

  function onPlayerReady(e){
    startTimeLoop();
    const vol = e.target.getVolume ? e.target.getVolume() : 100;
    document.getElementById('ccVolume').value = vol;
  }

  function onPlayerStateChange(e){
    const btn = document.getElementById('ccPlayPause');
    if (e.data === YT.PlayerState.PLAYING){
      btn.textContent = '⏸';
      startTimeLoop();
      scheduleHideControls();
    } else if (e.data === YT.PlayerState.PAUSED){
      btn.textContent = '▶';
      showControls(true);
    } else if (e.data === YT.PlayerState.ENDED){
      btn.textContent = '▶';
      clearInterval(timeLoop);
      showControls(true);
    }
  }

  /* ===== Auto-hide controls (like YouTube/Netflix): visible while paused or
     while the mouse/finger is active, fade out a couple seconds after the
     mouse stops moving while the video is playing. ===== */
  let hideTimer = null;

  function isPlaying(){
    return window.ytPlayer && window.ytPlayer.getPlayerState &&
      window.ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
  }

  function showControls(stayVisible){
    const bar = document.getElementById('customControls');
    const frame = document.getElementById('videoFrame');
    bar.classList.remove('hidden');
    frame.classList.remove('controls-hidden');
    clearTimeout(hideTimer);
    if (!stayVisible) scheduleHideControls();
  }

  function scheduleHideControls(){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (isPlaying() && !userSeeking){
        document.getElementById('customControls').classList.add('hidden');
        document.getElementById('videoFrame').classList.add('controls-hidden');
      }
    }, 2500);
  }

  function wireCustomControls(){
    const shield = document.getElementById('ytShield');
    const playBtn = document.getElementById('ccPlayPause');
    const muteBtn = document.getElementById('ccMute');
    const volume = document.getElementById('ccVolume');
    const progress = document.getElementById('ccProgress');
    const frame = document.getElementById('videoFrame');
    const fsBtn = document.getElementById('ccFullscreen');

    shield.addEventListener('click', togglePlay);
    playBtn.addEventListener('click', togglePlay);

    muteBtn.addEventListener('click', () => {
      if (!window.ytPlayer) return;
      if (window.ytPlayer.isMuted()) {
        window.ytPlayer.unMute();
        muteBtn.textContent = '🔊';
      } else {
        window.ytPlayer.mute();
        muteBtn.textContent = '🔇';
      }
    });

    volume.addEventListener('input', (e) => {
      if (!window.ytPlayer) return;
      const v = Number(e.target.value);
      window.ytPlayer.setVolume(v);
      if (v === 0) { window.ytPlayer.mute(); muteBtn.textContent = '🔇'; }
      else { window.ytPlayer.unMute(); muteBtn.textContent = '🔊'; }
    });

    function seekFracFromEvent(e){
      const rect = progress.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    }

    progress.addEventListener('pointerdown', (e) => {
      userSeeking = true;
      progress.classList.add('seeking');
      showControls(true);
      setFill(seekFracFromEvent(e));
      progress.setPointerCapture(e.pointerId);
    });
    progress.addEventListener('pointermove', (e) => {
      if (!userSeeking) return;
      setFill(seekFracFromEvent(e));
    });
    progress.addEventListener('pointerup', (e) => {
      progress.classList.remove('seeking');
      if (!userSeeking || !window.ytPlayer) { userSeeking = false; return; }
      const frac = seekFracFromEvent(e);
      const dur = window.ytPlayer.getDuration ? window.ytPlayer.getDuration() : 0;
      window.ytPlayer.seekTo(frac * dur, true);
      userSeeking = false;
      scheduleHideControls();
    });

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        (frame.requestFullscreen || frame.webkitRequestFullscreen || frame.msRequestFullscreen)?.call(frame);
        fsBtn.textContent = '⤡';
      } else {
        document.exitFullscreen();
        fsBtn.textContent = '⛶';
      }
    });

    // Any mouse/touch activity over the player keeps (or brings back) the bar.
    frame.addEventListener('mousemove', () => showControls(false));
    frame.addEventListener('mouseenter', () => showControls(false));
    frame.addEventListener('touchstart', () => showControls(false), { passive:true });
    frame.addEventListener('mouseleave', () => {
      if (isPlaying()) {
        document.getElementById('customControls').classList.add('hidden');
        frame.classList.add('controls-hidden');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '⤡' : '⛶';
    });
  }

  wireCustomControls();
</script>

<script type="module">
  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  function extractYouTubeId(input){
    if (!input) return null;
    const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    if (match) return match[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(input.trim())) return input.trim();
    return null;
  }

  const lessonId = getParam('lesson');
  const ep = getParam('ep');
  const backTo = getParam('back');

  document.getElementById('backLink').href = backTo || 'Home.html';

  const statusEl = document.getElementById('status');

  function showLocked(){
    statusEl.innerHTML = `
      <div class="lock-box">
        <div class="icon">🔒</div>
        <div class="title">This episode is locked</div>
        <p>Unlock කරගැනීමට admin ව සම්බන්ධ කරගන්න.</p>
        <a class="btn" href="${backTo || 'Home.html'}">← Back to lesson</a>
      </div>
    `;
  }

  function setupNotes(lessonId, ep){
    const key = `flp_note_${lessonId}_${ep}`;
    const area = document.getElementById('notesArea');
    const btn = document.getElementById('saveNoteBtn');
    const status = document.getElementById('saveStatus');

    const saved = localStorage.getItem(key);
    if (saved) area.value = saved;

    let statusTimer = null;
    function flashStatus(text, ok){
      status.textContent = text;
      status.classList.toggle('ok', !!ok);
      status.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('show'), 2000);
    }

    btn.addEventListener('click', () => {
      localStorage.setItem(key, area.value);
      flashStatus('✓ Saved on this device', true);
    });

    let typingTimer = null;
    area.addEventListener('input', () => {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        localStorage.setItem(key, area.value);
        flashStatus('Autosaved', false);
      }, 1200);
    });
  }

  if (!lessonId || !ep) {
    statusEl.innerHTML = `
      <div class="lock-box">
        <div class="icon">⚠️</div>
        <div class="title">Missing video information</div>
        <p>This link is missing the lesson or episode details.</p>
        <a class="btn" href="Home.html">← Go home</a>
      </div>
    `;
  } else {
    await window.FLP.ready;

    const access = await window.FLP.getLessonAccess(lessonId);
    const unlocked = access.full || !!access.episodes[ep];

    if (!unlocked) {
      showLocked();
    } else {
      const link = await window.FLP.getVideoUrl(lessonId, ep);
      const videoId = extractYouTubeId(link);

      if (!videoId) {
        statusEl.innerHTML = `
          <div class="lock-box">
            <div class="icon">📹</div>
            <div class="title">No video set yet</div>
            <p>An admin hasn't added a video link for this episode yet.</p>
            <a class="btn" href="${backTo || 'Home.html'}">← Back to lesson</a>
          </div>
        `;
      } else {
        // Hand the raw videoId to the player (see createPlayer in the earlier
        // script block) rather than building an embed URL ourselves - letting
        // YT.Player construct its own iframe is what makes play/pause/seek
        // actually respond when combined with the nocookie host.
        window.pendingVideoId = videoId;

        document.getElementById('epTag').textContent = 'EP ' + ep;
        document.getElementById('epTitle').textContent = decodeURIComponent(getParam('title') || '');
        document.getElementById('epUnit').textContent = decodeURIComponent(getParam('unit') || '');
        statusEl.style.display = 'none';
        document.getElementById('playerWrap').classList.add('ready');
        setupNotes(lessonId, ep);

        if (ytApiReady) createPlayer();
        else pendingVideoInit = true;
      }
    }
  }
</script>

<script src="assets/ai-widget.js"></script>
  <script src="assets/spider-cursor.js"></script>
</body>
</html>
