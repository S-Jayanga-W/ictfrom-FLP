<!DOCTYPE html>
<html lang="si">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ictfrom | Free Learn Pack (FLP) | Profile</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
  :root{
    --black:#0a0a0a;
    --black-2:#141414;
    --red:#e5121a;
    --red-dim:#7a0c11;
    --white:#f5f5f5;
    --grey:#8a8a8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Consolas','Courier New',monospace;
    background:var(--black);
    color:var(--white);
    position:relative;
    min-height:100vh;
  }

  .bg-layer{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(229,18,26,0.10), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(229,18,26,0.08), transparent 50%),
      var(--black);
  }

  #netCanvas{
    position:fixed; inset:0; z-index:0; display:block;
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    z-index:0;
    opacity:.55;
    animation:drift ease-in-out infinite alternate;
  }
  .orb.red{ background:radial-gradient(circle, rgba(229,18,26,0.55), transparent 70%); }
  .orb.white{ background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .orb1{ width:420px; height:420px; top:-10%; left:-8%; animation-duration:18s; }
  .orb2{ width:360px; height:360px; bottom:-12%; right:-6%; animation-duration:22s; animation-delay:2s; }
  .orb3{ width:260px; height:260px; top:40%; left:65%; animation-duration:16s; animation-delay:4s; }
  @keyframes drift{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,-30px) scale(1.12); }
    100%{ transform:translate(-30px,25px) scale(0.95); }
  }

  .scanline{
    position:fixed; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow:0 0 20px 4px rgba(229,18,26,0.6);
    animation:scan 6s ease-in-out infinite;
    z-index:1; opacity:.6;
  }
  @keyframes scan{
    0%{top:0%;}
    50%{top:100%;}
    100%{top:0%;}
  }

  .wrap{
    position:relative; z-index:2;
    width:100%; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 16px;
  }

  .card{
    width:480px;
    max-width:92vw;
    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(229,18,26,0.35);
    border-radius:14px;
    padding:42px 36px 34px;
    box-shadow:0 0 40px rgba(229,18,26,0.15), 0 20px 60px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
    animation:cardIn .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(30px) scale(.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .card::before{
    content:"";
    position:absolute; top:-2px; left:-2px; right:-2px; height:3px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    animation:sweep 3s linear infinite;
  }
  @keyframes sweep{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }

  .brand{ text-align:center; margin-bottom:20px; }
  .brand .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:3px;
    color:var(--red);
    border:1px solid var(--red-dim);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:14px;
    animation:pulseTag 2.4s ease-in-out infinite;
  }
  @keyframes pulseTag{
    0%,100%{box-shadow:0 0 0 rgba(229,18,26,0);}
    50%{box-shadow:0 0 12px rgba(229,18,26,0.5);}
  }
  h1{
    font-family:'Segoe UI', sans-serif;
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
    text-align:center;
    color:var(--white);
    text-transform:uppercase;
  }
  h1 span{color:var(--red);}
  .sub{
    text-align:center;
    color:var(--grey);
    font-size:12.5px;
    margin-top:6px;
    letter-spacing:.5px;
  }

  /* avatar */
  .avatar-wrap{
    display:flex; justify-content:center; margin:22px 0 6px;
  }
  .avatar{
    width:88px; height:88px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--red);
    box-shadow:0 0 22px rgba(229,18,26,0.35);
    background:var(--black-2);
  }
  .p-name{
    text-align:center;
    font-family:'Segoe UI', sans-serif;
    font-size:19px;
    font-weight:700;
    margin-top:12px;
  }
  .p-email{
    text-align:center;
    color:var(--grey);
    font-size:12px;
    margin-top:3px;
    word-break:break-all;
  }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin:22px 0 16px;
    color:var(--grey); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  }
  .divider::before,.divider::after{
    content:""; flex:1; height:1px; background:rgba(255,255,255,0.12);
  }

  .info-grid{ display:flex; flex-direction:column; gap:12px; }
  .info-row{
    display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:8px;
    padding:12px 14px;
  }
  .info-row .icon{
    width:20px; height:20px; flex-shrink:0; color:var(--red);
  }
  .info-row .meta{ min-width:0; }
  .info-row .meta .k{
    font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--grey);
  }
  .info-row .meta .v{
    font-size:14px; color:var(--white); margin-top:2px;
    overflow-wrap:break-word;
  }

    
  .logout-btn{
    width:100%;
    margin-top:26px;
    padding:13px;
    border:1px solid rgba(229,18,26,0.5);
    border-radius:8px;
    background:transparent;
    color:var(--red);
    font-size:14px; font-weight:700; letter-spacing:.5px;
    cursor:pointer;
    transition:background .2s, color .2s, box-shadow .25s;
    font-family:inherit;
  }
  .logout-btn:hover{
    background:var(--red);
    color:var(--white);
    box-shadow:0 0 20px rgba(229,18,26,0.35);
  }


  .loading{
    text-align:center; color:var(--grey); font-size:13px; padding:40px 0;
  }
  .toast{
    position:fixed; bottom:26px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--black-2); border:1px solid var(--red); color:var(--white);
    padding:12px 22px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
    z-index:10; box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success{border-color:#2ecc71; color:#2ecc71;}
  .hidden{display:none;}

  @media (max-width:420px){
    .card{padding:32px 22px 26px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="netCanvas"></canvas>
<div class="orb red orb1"></div>
<div class="orb white orb2"></div>
<div class="orb red orb3"></div>
<div class="scanline"></div>

<div class="wrap">
  <div class="card">
    <div class="brand">
      <span class="tag">STUDENT PROFILE</span>
      <h1>MY<span> PROFILE</span></h1>
      <div class="sub">ictfrom | Free Learn Pack (FLP)</div>
    </div>

    <div id="loadingState" class="loading">Loading your profile...</div>

    <div id="profileContent" class="hidden">
      <div class="avatar-wrap">
        <img id="pAvatar" class="avatar" src="" alt="avatar">
      </div>
      <div class="p-name" id="pName">—</div>
      <div class="p-email" id="pEmail">—</div>

      <div class="divider">Student Details</div>

      <div class="info-grid">
        <div class="info-row">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.7 5.1 6.5 6.5l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
          <div class="meta"><div class="k">Phone</div><div class="v" id="pPhone">—</div></div>
        </div>
        <div class="info-row">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
          <div class="meta"><div class="k">Address</div><div class="v" id="pAddress">—</div></div>
        </div>
        <div class="info-row">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2V17c0 2.2 3.1 4 7 4s7-1.8 7-4v-3.8l-7 3.8-7-3.8z"/></svg>
          <div class="meta"><div class="k">School</div><div class="v" id="pSchool">—</div></div>
        </div>
        <div class="info-row">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 7l11 5 9-4.1V17h2V7L12 2zM5 12.4V16c0 2.2 3.1 4 7 4s7-1.8 7-4v-3.6l-7 3.2-7-3.2z"/></svg>
          <div class="meta"><div class="k">A/L Batch</div><div class="v" id="pBatch">—</div></div>
        </div>
      </div>

    <a href="index.html">  <button type="button" class="logout-btn" id="logoutBtn">Logout</button></a>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  // =========================================================
  // FIREBASE SETUP (same project as login/register page)
  // =========================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCagFTgiAReVNf8PxNppg01URkQRPoNw3A",
    authDomain: "ictfrom-free-learn-pack.firebaseapp.com",
    databaseURL: "https://ictfrom-free-learn-pack-default-rtdb.firebaseio.com",
    projectId: "ictfrom-free-learn-pack",
    storageBucket: "ictfrom-free-learn-pack.firebasestorage.app",
    messagingSenderId: "621015284854",
    appId: "1:621015284854:web:850148451720ff2529b357",
    measurementId: "G-7MPX23W72F"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const LOGIN_PAGE = 'index_log.html'; // <-- change this if your login file has a different name

  // ---- network background (canvas: red/white nodes on black) ----
  (function(){
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, nodes;
    const NODE_COUNT = 70;
    const LINK_DIST = 140;
    const mouse = { x:null, y:null };

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makeNodes(){
      nodes = [];
      for(let i=0;i<NODE_COUNT;i++){
        const isRed = Math.random() < 0.4;
        nodes.push({
          x: Math.random()*w,
          y: Math.random()*h,
          vx: (Math.random()-0.5)*0.35,
          vy: (Math.random()-0.5)*0.35,
          r: isRed ? Math.random()*2+1.4 : Math.random()*1.6+0.8,
          color: isRed ? '229,18,26' : '245,245,245'
        });
      }
    }
    makeNodes();

    window.addEventListener('mousemove', e=>{
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', ()=>{ mouse.x=null; mouse.y=null; });

    function step(){
      ctx.clearRect(0,0,w,h);
      for(const n of nodes){
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > w) n.vx *= -1;
        if(n.y < 0 || n.y > h) n.vy *= -1;

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${n.color},0.85)`;
        ctx.shadowColor = `rgba(${n.color},0.8)`;
        ctx.shadowBlur = 6;
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for(let i=0;i<nodes.length;i++){
        for(let j=i+1;j<nodes.length;j++){
          const a = nodes[i], b = nodes[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < LINK_DIST){
            const alpha = (1 - dist/LINK_DIST) * 0.35;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(229,18,26,${alpha})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
        if(mouse.x !== null){
          const dx = nodes[i].x-mouse.x, dy = nodes[i].y-mouse.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 160){
            const alpha = (1 - dist/160) * 0.6;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(245,245,245,${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(step);
    }
    step();
  })();

  // ---- toast ----
  const toast = document.getElementById('toast');
  function showToast(msg, ok){
    toast.textContent = msg;
    toast.className = 'toast show' + (ok ? ' success':'');
    setTimeout(()=>{ toast.className='toast'; }, 3200);
  }

  // =========================================================
  // AUTH GUARD + AUTO-LOAD PROFILE DATA FROM DATABASE
  // =========================================================
  const loadingState = document.getElementById('loadingState');
  const profileContent = document.getElementById('profileContent');

  onAuthStateChanged(auth, async (user) => {
    if(!user){
      // not logged in -> send back to login page
      window.location.href = LOGIN_PAGE;
      return;
    }

    try{
      const snap = await get(ref(db, 'users/' + user.uid));
      if(!snap.exists()){
        showToast('No profile data found for this account.', false);
        loadingState.textContent = 'No profile data found. Please register first.';
        return;
      }

      const data = snap.val();

      document.getElementById('pName').textContent = data.name || '—';
      document.getElementById('pEmail').textContent = data.email || user.email || '—';
      document.getElementById('pPhone').textContent = data.phone || '—';
      document.getElementById('pAddress').textContent = data.address || '—';
      document.getElementById('pSchool').textContent = data.school || '—';
      document.getElementById('pBatch').textContent = data.alBatch || '—';

      const avatar = document.getElementById('pAvatar');
      avatar.src = data.photoURL || user.photoURL ||
        'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(data.name || 'Student');

      loadingState.classList.add('hidden');
      profileContent.classList.remove('hidden');
    }catch(err){
      showToast(err.message.replace('Firebase: ',''), false);
      loadingState.textContent = 'Could not load profile.';
    }
  });

  // ---- logout ----
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    try{
      await signOut(auth);
      window.location.href = LOGIN_PAGE;
    }catch(err){
      showToast(err.message.replace('Firebase: ',''), false);
    }
  });
</script>

</body>
</html>
